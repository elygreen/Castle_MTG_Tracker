<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castle MTG — Player Insight</title>
    <link rel="icon" type="image/x-icon" href="castleicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="insight">
    <div class="container" style="max-width: 950px;">
        <header>
            <h1>Castle MTG Stat Tracker</h1>
        </header>

        <nav class="tab-nav">
            <a class="tab-btn" href="record.html">Record Match</a>
            <a class="tab-btn" href="history.html">History</a>
            <a class="tab-btn" href="standings.html">Standings</a>
            <a class="tab-btn" href="insight.html">Player Insight</a>
            <a class="tab-btn" href="database.html">Database</a>
        </nav>

        <section>
            <div id="insightHeader" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="insightTitle" style="margin: 0;">Player Insight</h2>
                <button id="backToPlayersBtn" class="btn-blue" style="display: none; padding: 5px 15px;">← Back to Players</button>
            </div>

            <div class="insight-viewport">
                <div id="insightSlider" class="insight-slider">
                    <div id="insightPlayerList" class="insight-slide"></div>
                    <div id="insightDetailView" class="insight-slide"></div>
                </div>
            </div>
        </section>

        <!-- Modal (needed by edit-deck trigger from insight) -->
        <div id="customModal" class="modal-overlay">
            <div class="modal-card">
                <h3 id="modalTitle">Modal Title</h3>
                <div id="modalBody">Modal Body</div>
                <div id="modalActions" class="modal-actions"></div>
            </div>
        </div>
    </div>

    <script type="module" src="insight_page.js"></script>
</body>
</html>
