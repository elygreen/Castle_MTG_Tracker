<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castle MTG — History</title>
    <link rel="icon" type="image/x-icon" href="castleicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="history">
    <div class="container" style="max-width: 950px;">
        <header>
            <div class="site-title">
                <div class="site-title-eyebrow">Stat Tracker</div>
                <h1>🏰 Castle MTG</h1>
                <div class="site-title-divider">
                    <div class="site-title-line"></div>
                    <span class="site-title-divider-icon">⚔</span>
                    <div class="site-title-line right"></div>
                </div>
            </div>
        </header>

        <nav class="tab-nav">
            <a class="tab-btn" href="record.html">Record Match</a>
            <a class="tab-btn" href="history.html">History</a>
            <a class="tab-btn" href="standings.html">Standings</a>
            <a class="tab-btn" href="insight.html">Player Insight</a>
            <a class="tab-btn" href="database.html">Database</a>
        </nav>

        <section>
            <h2>Recent Matches</h2>
            <div id="matchHistoryList"></div>
        </section>
    </div>

    <script type="module" src="history_page.js"></script>

    <!-- Delete confirmation modal -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal-card">
            <h3 style="margin-top:0; color: var(--danger);">Delete Match?</h3>
            <div style="font-size: 0.85rem; color: var(--text-dim); margin-bottom: 6px;">
                <span id="deleteModalDate" style="font-weight:800; color: var(--text-main);"></span>
            </div>
            <div style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 16px;">
                <span id="deleteModalPlayers"></span>
            </div>
            <p style="font-size: 0.8rem; color: var(--text-dim); margin: 0 0 20px;">
                This will permanently delete the match and reverse all stat changes for every deck involved.
            </p>
            <div class="modal-actions">
                <button id="confirmDeleteBtn" style="background-color: var(--danger); color: white;">Delete & Reverse Stats</button>
                <button id="cancelDeleteBtn">Cancel</button>
            </div>
        </div>
    </div>

</body>
</html>
