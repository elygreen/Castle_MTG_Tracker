<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castle MTG — Standings</title>
    <link rel="icon" type="image/x-icon" href="castleicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="standings">
    <div class="container" style="max-width: 950px;">
        <header>
            <div class="site-title">
                <div class="site-title-eyebrow">Stat Tracker</div>
                <h1>🏰 Castle MTG</h1>
                <div class="site-title-divider">
                    <div class="site-title-line"></div>
                    <span class="site-title-divider-icon">⚔</span>
                    <div class="site-title-line right"></div>
                </div>
            </div>
        </header>

        <nav class="tab-nav">
            <a class="tab-btn" href="record.html">Record Match</a>
            <a class="tab-btn" href="history.html">History</a>
            <a class="tab-btn" href="standings.html">Standings</a>
            <a class="tab-btn" href="insight.html">Player Insight</a>
            <a class="tab-btn" href="database.html">Database</a>
        </nav>

        <section>
            <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 12px;">
                <h2 style="margin: 0;">Leaderboard</h2>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <label style="font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); white-space: nowrap;">Sort By</label>
                    <select id="standingsSortSelect" style="margin: 0; padding: 6px 10px; font-size: 0.75rem; font-weight: 700; min-width: 160px;">
                        <option value="gamesPlayed">Games Played</option>
                        <option value="solRingOpening">Sol Ring</option>
                        <option value="mulliganCount">2+ Mulligans</option>
                        <option value="firstBloodCount">First Blood</option>
                        <option value="mostRampCount">Most Ramp</option>
                        <option value="mostDrawCount">Most Draw</option>
                        <option value="wentFirstCount">Went First</option>
                        <option value="wentLastCount">Went Last</option>
                        <option value="deckName">Name (A–Z)</option>
                    </select>
                </div>
            </div>
            <div id="loading">Syncing with multiverses...</div>
            <ul id="deckList" style="list-style: none; padding: 0;"></ul>
        </section>
    </div>

    <script type="module" src="standings_page.js"></script>
</body>
</html>
